name: Preview CI (Verification Gate)

on:
  push:
    branches:
      - preview
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, Test & Build Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript Typecheck
        run: pnpm typecheck

      - name: Run Unit & Integration Tests
        run: pnpm test

      - name: Build Extension (Chrome & Firefox)
        run: pnpm build

      - name: Package Release ZIPs
        run: pnpm package:zip

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: formpilot-preview-zips
          path: releases/*.zip
          retention-days: 7
