name: Automated Release Pipeline (main -> release)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.1). Leave blank to auto-generate from run number.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Tag & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Determine Version Code
        id: versioning
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Automatically generate version code using github.run_number: 1.0.<run_number>
            VERSION="1.0.${{ github.run_number }}"
          fi
          # Strip leading v if any
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION (Tag: v$VERSION)"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Update Version Code in Manifests & Package
        run: node scripts/set-version.js ${{ steps.versioning.outputs.version }}

      - name: TypeScript Typecheck
        run: pnpm typecheck

      - name: Run Tests
        run: pnpm test

      - name: Build Extension (Chrome & Firefox)
        run: pnpm build

      - name: Package ZIP Archives
        run: pnpm package:zip

      - name: Configure Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and Push Git Tag
        run: |
          TAG="${{ steps.versioning.outputs.tag }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Update Release Branch
        run: |
          git fetch origin release || true
          if git show-ref --quiet refs/remotes/origin/release; then
            git checkout -B release origin/release
            git merge main --no-edit -m "chore(release): sync main into release branch"
          else
            git checkout -B release
          fi

          git add -f releases/*.zip
          git commit -m "chore(release): add ${{ steps.versioning.outputs.tag }} release archives" || echo "No changes to commit"
          git push origin release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: FormPilot ${{ steps.versioning.outputs.tag }}
          body: |
            ## FormPilot ${{ steps.versioning.outputs.tag }} Release
            
            **Your forms. Your profile. One click.**
            Privacy-first student profile autofill browser extension for Google Forms.
            
            ### Included Archives:
            - `formpilot-chrome-v${{ steps.versioning.outputs.version }}.zip`: For Google Chrome, Brave, Arc, Microsoft Edge, Opera, and Vivaldi.
            - `formpilot-firefox-v${{ steps.versioning.outputs.version }}.zip`: For Mozilla Firefox.
            
            ### Installation:
            1. Download the zip archive for your browser below.
            2. Extract the zip to a folder.
            3. Open your browser's extension page (`chrome://extensions`, `brave://extensions`, `arc://extensions`, etc.).
            4. Enable **Developer mode** and click **Load unpacked**.
            5. Select the extracted folder.
          files: |
            releases/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
